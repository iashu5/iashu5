<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" role="img" aria-label="Experience timeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="0.5" stop-color="#512BD4"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <style>
    .dt{font:600 11.5px 'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#c7d2fe}
    .r{font:700 15px 'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#fff}
    .c{font:500 13px 'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#94a3b8}
    .g{font:600 11.5px 'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#38bdf8}
    .h{font:700 13px 'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#a5b4fc;letter-spacing:2px}
    .line{stroke-dasharray:679;stroke-dashoffset:679;animation:draw 1.6s ease-out .2s forwards}
    .node{opacity:0;animation:fade .6s ease-out forwards}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
  </style>
  <rect x="1.5" y="1.5" width="857" height="217" rx="18" fill="url(#bg)" stroke="url(#bd)" stroke-width="2"/>
  <text x="28" y="34" class="h">CAREER JOURNEY</text>
  <linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="769" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  <line class="line" x1="90" y1="110" x2="769" y2="110" stroke="url(#ln)" stroke-width="4" stroke-linecap="round"/>
  
  <g class="node" style="animation-delay:0.4s">
    <rect x="32" y="48" width="156" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.7"/>
    <text x="110" y="65.5" text-anchor="middle" class="dt">Aug 2023 – Feb 2024</text>
    
    <circle cx="110" cy="110" r="9" fill="#7c3aed" stroke="#0f172a" stroke-width="3"/>
    <text x="110" y="150" text-anchor="middle" class="r">Trainee Developer</text>
    <text x="110" y="172" text-anchor="middle" class="c">Medimaze Solutions</text>
    <text x="110" y="194" text-anchor="middle" class="g">React · TypeScript</text>
  </g>
  <g class="node" style="animation-delay:0.75s">
    <rect x="245" y="48" width="156" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.7"/>
    <text x="323" y="65.5" text-anchor="middle" class="dt">Mar 2024 – Aug 2024</text>
    
    <circle cx="323" cy="110" r="9" fill="#7c3aed" stroke="#0f172a" stroke-width="3"/>
    <text x="323" y="150" text-anchor="middle" class="r">Java Developer Intern</text>
    <text x="323" y="172" text-anchor="middle" class="c">SevenMentor</text>
    <text x="323" y="194" text-anchor="middle" class="g">Spring Boot · MySQL</text>
  </g>
  <g class="node" style="animation-delay:1.1s">
    <rect x="458" y="48" width="156" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.7"/>
    <text x="536" y="65.5" text-anchor="middle" class="dt">Nov 2024 – Apr 2026</text>
    
    <circle cx="536" cy="110" r="9" fill="#7c3aed" stroke="#0f172a" stroke-width="3"/>
    <text x="536" y="150" text-anchor="middle" class="r">.NET Developer</text>
    <text x="536" y="172" text-anchor="middle" class="c">YSAAS Infotech</text>
    <text x="536" y="194" text-anchor="middle" class="g">ERP · .NET Core</text>
  </g>
  <g class="node" style="animation-delay:1.4499999999999997s">
    <rect x="671" y="48" width="156" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.7"/>
    <text x="749" y="65.5" text-anchor="middle" class="dt">May 2026 – Sep 2026</text>
    <circle cx="749" cy="110" r="11" fill="#0ea5e9" class="pulse"/>
    <circle cx="749" cy="110" r="9" fill="#0ea5e9" stroke="#0f172a" stroke-width="3"/>
    <text x="749" y="150" text-anchor="middle" class="r">Software Developer</text>
    <text x="749" y="172" text-anchor="middle" class="c">Gtech WebSolutions</text>
    <text x="749" y="194" text-anchor="middle" class="g">NBFC · KYC · RDLC</text>
  </g>
</svg>