<svg xmlns="http://www.w3.org/2000/svg" width="420" height="210" viewBox="0 0 420 210" role="img" aria-label="Student Management">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="0.5" stop-color="#512BD4"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <style>
    .t{font:700 19px 'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#fff}
    .d{font:400 13.5px 'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#cbd5e1}
    .p{font:600 11px 'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#e0e7ff}
    .b{font:800 15px 'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#fff}
    .card{animation:rise .7s ease-out both}
    .pill{animation:pop .5s ease-out both}
    .glow{animation:glow 3s ease-in-out infinite}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes pop{from{opacity:0}to{opacity:1}}
    @keyframes glow{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}
  </style>
  <g class="card">
    <rect x="1.5" y="1.5" width="417" height="207" rx="16" fill="url(#bg)"/>
    <rect class="glow" x="1.5" y="1.5" width="417" height="207" rx="16" fill="none" stroke="url(#bd)" stroke-width="2.5"/>
    <circle cx="380" cy="40" r="70" fill="#7c3aed" fill-opacity="0.08"/>
    <rect x="22" y="22" width="40" height="40" rx="11" fill="url(#ic)"/>
    <text x="42" y="47.5" text-anchor="middle" class="b">SM</text>
    <text x="76" y="48" class="t">Student Management</text>
    <text x="24" y="92" class="d">.NET 8 Web API + React UI with JWT auth,</text>
    <text x="24" y="113" class="d">global exception middleware, Serilog</text>
    <text x="24" y="134" class="d">logging and Swagger docs.</text>
    <g class="pill" style="animation-delay:0.5s">
      <rect x="22" y="166" width="110.4" height="22" rx="11" fill="#312e81" fill-opacity="0.75" stroke="#6366f1" stroke-opacity="0.6"/>
      <text x="77.2" y="181" text-anchor="middle" class="p">.NET 8 Web API</text></g><g class="pill" style="animation-delay:0.62s">
      <rect x="139.39999999999998" y="166" width="37.8" height="22" rx="11" fill="#312e81" fill-opacity="0.75" stroke="#6366f1" stroke-opacity="0.6"/>
      <text x="158.3" y="181" text-anchor="middle" class="p">JWT</text></g><g class="pill" style="animation-delay:0.74s">
      <rect x="184.2" y="166" width="51.0" height="22" rx="11" fill="#312e81" fill-opacity="0.75" stroke="#6366f1" stroke-opacity="0.6"/>
      <text x="209.7" y="181" text-anchor="middle" class="p">React</text></g><g class="pill" style="animation-delay:0.86s">
      <rect x="242.2" y="166" width="84.0" height="22" rx="11" fill="#312e81" fill-opacity="0.75" stroke="#6366f1" stroke-opacity="0.6"/>
      <text x="284.2" y="181" text-anchor="middle" class="p">TypeScript</text></g>
  </g>
</svg>